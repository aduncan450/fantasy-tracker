name: Automated QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run automated QA
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee qa.log

      - name: Upload QA diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-diagnostic-log
          path: qa.log
